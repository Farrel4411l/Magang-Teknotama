<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tekno Memory - TeknoGame</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #070b14; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    #hud { position: absolute; top: 14px; left: 16px; right: 16px; display: flex; justify-content: space-between; z-index: 10; max-width: 500px; margin: 0 auto; }
    .badge { background: rgba(15, 23, 42, 0.85); color: #fff; padding: 6px 14px; border-radius: 9999px; font-weight: 800; font-size: 14px; border: 1px solid rgba(0, 240, 255, 0.3); box-shadow: 0 0 10px rgba(0, 240, 255, 0.2); }
    .badge span { color: #00f0ff; }
    #grid-container { width: 90vw; max-width: 420px; height: 60vh; max-height: 480px; display: grid; gap: 8px; margin-top: 50px; }
    .card { background: #0f172a; border: 2px solid #1e293b; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 28px; cursor: pointer; transition: transform 0.15s, border-color 0.2s, background-color 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .card:active { transform: scale(0.96); }
    .card.revealed { background: #1e293b; border-color: #00f0ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
    .card.matched { background: rgba(16, 185, 129, 0.2); border-color: #10b981; cursor: default; }
    .overlay { position: absolute; inset: 0; background: rgba(7, 11, 20, 0.9); backdrop-filter: blur(6px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 20; color: #fff; text-align: center; padding: 20px; }
    .title { font-size: 32px; font-weight: 900; color: #00f0ff; text-shadow: 0 0 20px rgba(0, 240, 255, 0.6); margin-bottom: 8px; }
    .desc { font-size: 14px; color: #94a3b8; max-width: 300px; margin-bottom: 20px; line-height: 1.5; }
    .btn { background: linear-gradient(135deg, #00f0ff, #3b82f6); color: #070b14; border: none; padding: 12px 30px; border-radius: 9999px; font-weight: 900; font-size: 15px; cursor: pointer; box-shadow: 0 0 15px rgba(0, 240, 255, 0.4); }
    .btn:active { transform: scale(0.95); }
  </style>
</head>
<body>
  <div id="hud">
    <div class="badge">LVL: <span id="levelVal">1</span></div>
    <div class="badge">WAKTU: <span id="timerVal">15s</span></div>
    <div class="badge">SKOR: <span id="scoreVal">0</span></div>
  </div>

  <div id="grid-container"></div>

  <div id="startScreen" class="overlay">
    <div class="title">TEKNO MEMORY</div>
    <div class="desc">Ingat dan cocokkan semua kartu sebelum waktu habis! Setiap level jumlah kartu makin bertambah.</div>
    <button class="btn" id="startBtn">MULAI MAIN</button>
  </div>

  <div id="gameOverScreen" class="overlay" style="display: none;">
    <div class="title" style="color: #ef4444; text-shadow: 0 0 20px rgba(239,68,68,0.6);">WAKTU HABIS</div>
    <div class="desc" id="finalScoreTxt">Skor Akhir: 0</div>
    <button class="btn" id="restartBtn">MAIN LAGI</button>
  </div>

  <script>
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, dur, type='sine') {
      if (actx.state === 'suspended') actx.resume();
      const osc = actx.createOscillator(), gain = actx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, actx.currentTime);
      gain.gain.setValueAtTime(0.15, actx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + dur);
      osc.connect(gain); gain.connect(actx.destination);
      osc.start(); osc.stop(actx.currentTime + dur);
    }
    const Sound = {
      flip: () => playTone(600, 0.08),
      match: () => { playTone(523, 0.1); setTimeout(() => playTone(659, 0.15), 80); },
      wrong: () => playTone(180, 0.15, 'square'),
      win: () => { playTone(523, 0.1); setTimeout(() => playTone(784, 0.2), 100); }
    };

    const ALL_ICONS = ["⚡", "🎮", "💎", "🚀", "🤖", "🔥", "⭐", "🔋", "🛡️", "🛰️", "🛸", "⚙️"];
    const LEVELS = [
      { cols: 2, rows: 2, time: 15 },
      { cols: 2, rows: 3, time: 20 },
      { cols: 2, rows: 4, time: 25 },
      { cols: 3, rows: 4, time: 30 },
      { cols: 4, rows: 4, time: 35 },
      { cols: 4, rows: 5, time: 40 }
    ];

    let currentLevel = 0;
    let score = 0;
    let timeLeft = 15;
    let timerInterval = null;
    let flippedCards = [];
    let isLocked = false;
    let matchedCount = 0;
    let totalPairs = 0;

    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        timeLeft--;
        document.getElementById('timerVal').innerText = timeLeft + 's';
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          gameOver();
        }
      }, 1000);
    }

    function initLevel() {
      const cfg = LEVELS[Math.min(currentLevel, LEVELS.length - 1)];
      totalPairs = (cfg.cols * cfg.rows) / 2;
      matchedCount = 0;
      timeLeft = cfg.time;
      document.getElementById('levelVal').innerText = (currentLevel + 1);
      document.getElementById('timerVal').innerText = timeLeft + 's';
      document.getElementById('scoreVal').innerText = score;

      const container = document.getElementById('grid-container');
      container.innerHTML = '';
      container.style.gridTemplateColumns = `repeat(${cfg.cols}, 1fr)`;
      container.style.gridTemplateRows = `repeat(${cfg.rows}, 1fr)`;

      const selectedIcons = ALL_ICONS.slice(0, totalPairs);
      const deck = [...selectedIcons, ...selectedIcons].sort(() => Math.random() - 0.5);

      deck.forEach((icon, idx) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.icon = icon;
        card.dataset.index = idx;
        card.innerHTML = '';
        card.onclick = () => onCardClick(card);
        container.appendChild(card);
      });

      startTimer();
    }

    function onCardClick(card) {
      if (isLocked || card.classList.contains('revealed') || card.classList.contains('matched')) return;

      Sound.flip();
      card.classList.add('revealed');
      card.innerText = card.dataset.icon;
      flippedCards.push(card);

      if (flippedCards.length === 2) {
        isLocked = true;
        const [c1, c2] = flippedCards;

        if (c1.dataset.icon === c2.dataset.icon) {
          setTimeout(() => {
            c1.classList.add('matched');
            c2.classList.add('matched');
            flippedCards = [];
            isLocked = false;
            matchedCount++;
            score += 15;
            document.getElementById('scoreVal').innerText = score;
            Sound.match();

            if (matchedCount === totalPairs) {
              clearInterval(timerInterval);
              Sound.win();
              score += timeLeft * 5; // Bonus waktu
              setTimeout(() => {
                currentLevel++;
                initLevel();
              }, 800);
            }
          }, 300);
        } else {
          setTimeout(() => {
            Sound.wrong();
            c1.classList.remove('revealed');
            c2.classList.remove('revealed');
            c1.innerText = '';
            c2.innerText = '';
            flippedCards = [];
            isLocked = false;
          }, 600);
        }
      }
    }

    function startGame() {
      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('gameOverScreen').style.display = 'none';
      currentLevel = 0;
      score = 0;
      if (actx.state === 'suspended') actx.resume();
      initLevel();
    }

    function gameOver() {
      Sound.wrong();
      document.getElementById('finalScoreTxt').innerText = 'Skor Akhir: ' + score;
      document.getElementById('gameOverScreen').style.display = 'flex';
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "GAME_OVER", score: score }, "*");
      }
    }

    document.getElementById('startBtn').onclick = startGame;
    document.getElementById('restartBtn').onclick = startGame;
  </script>
</body>
</html>
